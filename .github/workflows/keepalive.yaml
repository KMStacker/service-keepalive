name: service-keepalive

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run keepalive worker
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
          AIVEN_PROJECT_NAME: ${{ secrets.AIVEN_PROJECT_NAME }}
          AIVEN_SERVICE_NAME: ${{ secrets.AIVEN_SERVICE_NAME }}
          RENDER_SITE_URL: ${{ secrets.RENDER_SITE_URL }}
        run: go run main.go